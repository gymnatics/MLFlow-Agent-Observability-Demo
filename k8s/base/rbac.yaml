---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracing-demo-agent
  labels:
    app.kubernetes.io/part-of: banking-tracing-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tracing-demo-mlflow-access
